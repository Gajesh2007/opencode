<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0b0d" />
    <title>opencode remote</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="bar-left">
          <button id="btn-back" class="icon-btn hidden" aria-label="Back">←</button>
          <div class="bar-title">
            <div id="bar-heading">opencode</div>
            <button id="bar-folder" class="bar-folder hidden" title="Switch folder"></button>
          </div>
        </div>
        <div class="bar-right">
          <span id="badge-host" class="badge badge-host-offline">host</span>
          <span id="badge-conn" class="badge badge-disconnected">offline</span>
        </div>
      </header>

      <div id="offline-banner" class="banner hidden">Waiting for the opencode host to come online…</div>

      <main id="screens">
        <!-- CONNECT -->
        <section id="screen-connect" class="screen">
          <div class="connect-scroll">
            <div class="connect-card">
              <h1 class="connect-logo">opencode</h1>
              <p class="connect-subtitle">Connect to your remote machine</p>

              <label class="field">
                <span>Relay URL</span>
                <input id="in-relay" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="wss://relay.example.com" />
              </label>
              <label class="field">
                <span>Room</span>
                <input id="in-room" type="text" autocapitalize="off" autocorrect="off" placeholder="my-room" />
              </label>
              <label class="field">
                <span>Token</span>
                <input id="in-token" type="password" autocapitalize="off" autocorrect="off" placeholder="secret token" />
              </label>
              <label class="field">
                <span>Working directory <span class="muted">(optional)</span></span>
                <input id="in-directory" type="text" autocapitalize="off" autocorrect="off" placeholder="/path/to/project" />
              </label>

              <button id="btn-connect" class="btn-primary">Connect</button>
              <button id="btn-paste" class="link-btn">Paste a connection string</button>
            </div>
          </div>
        </section>

        <!-- SESSIONS -->
        <section id="screen-sessions" class="screen hidden">
          <div class="sessions-toolbar">
            <button id="btn-folder" class="folder-chip" title="Switch folder">
              <span class="folder-icon">📁</span><span id="folder-label" class="folder-label">…</span>
            </button>
            <button id="btn-new" class="btn-small">+ New</button>
          </div>
          <div id="sessions-list" class="sessions-list"></div>
        </section>

        <!-- CHAT -->
        <section id="screen-chat" class="screen hidden">
          <div id="chat-host" class="chat-host"></div>
          <form id="composer" class="composer" autocomplete="off">
            <div class="composer-inner">
              <textarea
                id="prompt"
                class="prompt-input"
                rows="1"
                placeholder="Message opencode…"
                autocapitalize="sentences"
              ></textarea>
              <button id="btn-send" class="send-btn" type="submit" aria-label="Send" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </form>
        </section>
      </main>

      <!-- FOLDER BROWSER -->
      <div id="folder-modal" class="modal hidden">
        <div class="modal-sheet">
          <div class="modal-head">
            <h2>Working folder</h2>
            <button id="folder-close" class="icon-btn">✕</button>
          </div>
          <label class="field">
            <span>Absolute path</span>
            <div class="path-row">
              <input id="folder-path-input" type="text" autocapitalize="off" autocorrect="off" placeholder="/abs/path" />
              <button id="folder-path-go" class="btn-small">Use</button>
            </div>
          </label>
          <div class="browser">
            <div class="browser-head">
              <button id="browser-up" class="btn-small">↑ Up</button>
              <span id="browser-cwd" class="browser-cwd"></span>
            </div>
            <div id="browser-list" class="browser-list"></div>
            <button id="browser-use" class="btn-primary">Use this folder</button>
          </div>
          <div class="projects">
            <div class="projects-head">Projects</div>
            <div id="projects-list" class="projects-list"></div>
          </div>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
